<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow — Login</title>
    <meta name="description" content="Sign in or create an account to manage your projects and tasks with TaskFlow." />
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<div class="auth-page">
    <div class="auth-container">
        <div class="auth-header animate-in">
            <h1><span>Task</span>Flow</h1>
            <p>Project & Task Management for Teams</p>
        </div>

        <div class="auth-card animate-in delay-1">
            <div class="auth-tabs">
                <button class="auth-tab active" id="loginTab" onclick="switchTab('login')">Sign In</button>
                <button class="auth-tab" id="signupTab" onclick="switchTab('signup')">Sign Up</button>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="auth-form">
                <div id="loginError" class="auth-error hidden"></div>
                <div class="form-group">
                    <label class="form-label" for="loginEmail">Email</label>
                    <input id="loginEmail" type="email" class="form-input" placeholder="you@example.com" required />
                </div>
                <div class="form-group">
                    <label class="form-label" for="loginPassword">Password</label>
                    <input id="loginPassword" type="password" class="form-input" placeholder="••••••••" required />
                </div>
                <button type="submit" class="btn btn-primary" id="loginBtn">
                    <span id="loginBtnText">Sign In</span>
                </button>
            </form>

            <!-- Signup Form -->
            <form id="signupForm" class="auth-form hidden">
                <div id="signupError" class="auth-error hidden"></div>
                <div class="form-group">
                    <label class="form-label" for="signupName">Full Name</label>
                    <input id="signupName" type="text" class="form-input" placeholder="John Doe" required />
                </div>
                <div class="form-group">
                    <label class="form-label" for="signupEmail">Email</label>
                    <input id="signupEmail" type="email" class="form-input" placeholder="you@example.com" required />
                </div>
                <div class="form-group">
                    <label class="form-label" for="signupPassword">Password</label>
                    <input id="signupPassword" type="password" class="form-input" placeholder="Min. 6 characters" required />
                </div>
                <div class="form-group">
                    <label class="form-label" for="signupRole">Role</label>
                    <select id="signupRole" class="form-select">
                        <option value="member">Member</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary" id="signupBtn">
                    <span id="signupBtnText">Create Account</span>
                </button>
            </form>
        </div>
    </div>
</div>
<script src="js/api.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
